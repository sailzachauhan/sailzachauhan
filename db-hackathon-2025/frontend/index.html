<!DOCTYPE html>
<html>
<head>
  <title>We Enhance Your Idea</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    h2 {
      color: #333;
    }

    button {
      padding: 8px 16px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #responseBox {
      margin-top: 20px;
      border-left: 5px solid green;
      background: #f4f4f4;
      padding: 15px;
      font-family: "Courier New", monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 600px;
      overflow-y: auto;
      transition: background-color 0.5s ease;
    }

    .flash {
      background-color: #d4edda !important;
    }

    .error {
      background-color: #f8d7da;
      border-left: 5px solid red;
    }

    pre {
      margin-top: 10px;
      background: #eee;
      padding: 10px;
      border-radius: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>Upload JSON File</h2>
  <input type="file" id="fileInput" accept=".json" />
  <br><br>
  <button onclick="sendFile()">Send</button>

  <div id="responseBox">Waiting for response...</div>

  <script>
    async function sendFile() {
      const fileInput = document.getElementById('fileInput');
      const responseBox = document.getElementById('responseBox');
      if (!fileInput.files.length) {
        alert("Please select a JSON file.");
        return;
      }

      const file = fileInput.files[0];
      responseBox.textContent = "Sending file...";
      responseBox.className = '';

      try {
        const response = await fetch(
          'https://idea-enhancerservice-387307858496.us-central1.run.app/enhance_idea',
          {
            method: 'POST',
            body: file
          }
        );

        const text = await response.text();
        let content = "";

        try {
          const json = JSON.parse(text);
          const prettyJson = JSON.stringify(json, null, 2);
          // Also convert \n inside strings to real newlines
          const safeFormatted = prettyJson.replace(/\\n/g, '\n');
          content = `<pre>${safeFormatted}</pre>`;
        } catch {
          // Fallback if not JSON: still handle \n manually
          content = `<pre>${text.replace(/\\n/g, '\n')}</pre>`;
        }

        responseBox.innerHTML = `<strong>✅ Status: ${response.status}</strong>\n${content}`;
        responseBox.classList.add("flash");
        setTimeout(() => responseBox.classList.remove("flash"), 2000);

      } catch (err) {
        responseBox.innerHTML = `<strong>❌ Error:</strong> ${err.message}`;
        responseBox.classList.add("error");
      }
    }
  </script>

</body>
</html>
